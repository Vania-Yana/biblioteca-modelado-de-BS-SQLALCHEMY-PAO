<!DOCTYPE html>
<html>
<head>
    <title>Crear Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Crear Producto</h2>
    <form method="POST" action="/create">
        <input type="text" name="name" class="form-control mb-2" placeholder="Nombre" required>
        <input type="number" step="0.01" name="price" class="form-control mb-2" placeholder="Precio" required>
        <input type="number" name="stock" class="form-control mb-2" placeholder="Stock" required>
        <button type="submit" class="btn btn-success">Guardar</button>
    </form>
</div>
</body>
</html>
